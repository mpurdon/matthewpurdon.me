e systems around AI-assisted engineering: platform boundaries, review loops, agent workflows, and the team habits that keep generated software from turning into entropy. And I lead the teams who run them.</p> <p style="font-family:var(--font-prose);font-size:var(--text-base);line-height:1.65;color:var(--text-secondary);max-width:680px;margin:0 0 18px;text-wrap:pretty">Twenty-five years in software, writing Field Notes on the new SDLC, code review, hiring for judgement, and how teams actually ship.</p> <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:26px"> <a href="https://github.com/mpurdon" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:0.4rem;white-space:nowrap;font-family:var(--font-mono);font-size:var(--text-sm);color:var(--text-secondary);text-decoration:none;padding:0.45rem 0.85rem;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-surface);transition:border-color var(--duration-base) var(--ease), color var(--duration-base) var(--ease)">GitHub <span style="color:var(--text-disabled)">↗</span></a><a href="https://www.linkedin.com/in/matthewdjpurdon" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:0.4rem;white-space:nowrap;font-family:var(--font-mono);font-size:var(--text-sm);color:var(--text-secondary);text-decoration:none;padding:0.45rem 0.85rem;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-surface);transition:border-color var(--duration-base) var(--ease), color var(--duration-base) var(--ease)">LinkedIn <span style="color:var(--text-disabled)">↗</span></a><a href="https://x.com/mpurdon" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:0.4rem;white-space:nowrap;font-family:var(--font-mono);font-size:var(--text-sm);color:var(--text-secondary);text-decoration:none;padding:0.45rem 0.85rem;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-surface);transition:border-color var(--duration-base) var(--ease), color var(--duration-base) var(--ease)">X <span style="color:var(--text-disabled)">↗</span></a><a href="mailto:hello@matthewpurdon.me" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:0.4rem;white-space:nowrap;font-family:var(--font-mono);font-size:var(--text-sm);color:var(--text-secondary);text-decoration:none;padding:0.45rem 0.85rem;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-surface);transition:border-color var(--duration-base) var(--ease), color var(--duration-base) var(--ease)">Email <span style="color:var(--text-disabled)">↗</span></a> </div> <div style="display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;align-items:center"> <a class="mp-btn mp-btn--solid mp-btn--md" href="/notes/" style="text-decoration:none">Read Field Notes</a> <a class="mp-btn mp-btn--outline mp-btn--md" href="/lab/" style="text-decoration:none">See Lab Reports</a> <a href="/about/" style="font-family:var(--font-mono);font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-wider);color:var(--text-secondary);text-decoration:none;padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-md);transition:all var(--duration-base) var(--ease)">About Matthew</a> </div> </div> </div> </section> <section style="padding:42px 0;border-bottom:1px solid var(--border)"> <div style="display:grid;grid-template-columns:60px 1fr;gap:18px;align-items:baseline;margin-bottom:22px"> <span style="color:var(--canada-300);font-family:var(--font-mono);font-weight:700;letter-spacing:0.18em;font-size:var(--text-xs)">01</span> <h2 style="margin:0;color:var(--text-primary);font-family:var(--font-mono);font-size:clamp(22px, 2.8vw, 26px);line-height:1.1;letter-spacing:-0.025em">The Work</h2> </div> <div style="display:grid;grid-template-columns:1.15fr 0.85fr;gap:46px;align-items:start"> <p style="margin:0;font-family:var(--font-prose);font-size:clamp(1.35rem, 2.3vw, 1.48rem);line-height:1.48;color:var(--prose-text);max-width:650px;text-wrap:pretty">My work sits at the intersection of <strong style="color:var(--text-primary)">architecture</strong>, <strong style="color:var(--text-primary)">process</strong>, and <strong style="color:var(--text-primary)">AI-assisted delivery</strong>. I care less about demos and more about the operating system that lets teams ship with models in the loop without lowering their standards.</p> <div style="border-left:2px solid var(--canada-500);padding-left:20px;display:grid;gap:14px;margin-top:4px"> <div style="display:grid;grid-template-columns:88px 1fr;gap:14px;line-height:1.45"> <span style="color:var(--text-muted);font-family:var(--font-label);font-size:11px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700">Writing</span> <span style="color:var(--text-secondary);font-family:var(--font-prose);font-size:var(--text-base)">principal engineering, review, AI-assisted delivery</span> </div><div style="display:grid;grid-template-columns:88px 1fr;gap:14px;line-height:1.45"> <span style="color:var(--text-muted);font-family:var(--font-label);font-size:11px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700">Building</span> <span style="color:var(--text-secondary);font-family:var(--font-prose);font-size:var(--text-base)">agentic tools, MCP servers, local-first review systems</span> </div><div style="display:grid;grid-template-columns:88px 1fr;gap:14px;line-height:1.45"> <span style="color:var(--text-muted);font-family:var(--font-label);font-size:11px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700">Arguing</span> <span style="color:var(--text-secondary);font-family:var(--font-prose);font-size:var(--text-base)">review is now the main engineering act</span> </div><div style="display:grid;grid-template-columns:88px 1fr;gap:14px;line-height:1.45"> <span style="color:var(--text-muted);font-family:var(--font-label);font-size:11px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700">Based</span> <span style="color:var(--text-secondary);font-family:var(--font-prose);font-size:var(--text-base)">Toronto, Canada</span> </div> </div> </div> </section> <section style="padding:42px 0;border-bottom:1px solid var(--border)"> <div style="display:grid;grid-template-columns:60px 1fr;gap:18px;align-items:baseline;margin-bottom:22px"> <span style="color:var(--canada-300);font-family:var(--font-mono);font-weight:700;letter-spacing:0.18em;font-size:var(--text-xs)">02</span> <h2 style="margin:0;color:var(--text-primary);font-family:var(--font-mono);font-size:clamp(22px, 2.8vw, 26px);line-height:1.1;letter-spacing:-0.025em">Start Here</h2> </div> <div style="display:grid;gap:0;border-top:1px solid var(--border)"> <a href="/notes/judgement-is-the-job-now/" style="display:grid;grid-template-columns:64px 1fr 18px;gap:18px;padding:20px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit"><span aria-hidden="true" style="color:var(--text-muted);font-family:var(--font-mono);font-weight:700;letter-spacing:-0.04em;font-size:32px;line-height:1">02</span><span><h3 style="margin:0 0 7px;font-family:var(--font-mono);font-size:var(--text-lg);color:var(--text-primary);letter-spacing:-0.025em">Judgement is the job now</h3><p style="margin:0;max-width:730px;font-family:var(--font-prose);font-size:var(--text-base);line-height:1.55;color:var(--text-secondary)">AI removed the effort filter. Taste, review, and technical judgement are what remain.</p></span><span aria-hidden="true" style="color:var(--canada-300);font-size:18px;padding-top:2px">→</span></a><a href="/notes/what-is-a-principal-engineer/" style="display:grid;grid-template-columns:64px 1fr 18px;gap:18px;padding:20px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit"><span aria-hidden="true" style="color:var(--text-muted);font-family:var(--font-mono);font-weight:700;letter-spacing:-0.04em;font-size:32px;line-height:1">05</span><span><h3 style="margin:0 0 7px;font-family:var(--font-mono);font-size:var(--text-lg);color:var(--text-primary);letter-spacing:-0.025em">What is a principal engineer?</h3><p style="margin:0;max-width:730px;font-family:var(--font-prose);font-size:var(--text-base);line-height:1.55;color:var(--text-secondary)">Principal engineering is not one archetype. It is the ability to shift between all four without losing the thread.</p></span><span aria-hidden="true" style="color:var(--canada-300);font-size:18px;padding-top:2px">→</span></a><a href="/notes/interviewing-the-ai-assisted-engineer/" style="display:grid;grid-template-columns:64px 1fr 18px;gap:18px;padding:20px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit"><span aria-hidden="true" style="color:var(--text-muted);font-family:var(--font-mono);font-weight:700;letter-spacing:-0.04em;font-size:32px;line-height:1">03</span><span><h3 style="margin:0 0 7px;font-family:var(--font-mono);font-size:var(--text-lg);color:var(--text-primary);letter-spacing:-0.025em">Interviewing the AI-assisted engineer</h3><p style="margin:0;max-width:730px;font-family:var(--font-prose);font-size:var(--text-base);line-height:1.55;color:var(--text-secondary)">Syntax under pressure is a dead proxy. Hire for the AI era by testing judgement and taste: a real task, a few quiet traps, and the review round.</p></span><span aria-hidden="true" style="color:var(--canada-300);font-size:18px;padding-top:2px">→</span></a> </div> </section> <section style="padding:42px 0;border-bottom:1px solid var(--border)"> <div style="display:grid;grid-template-columns:60px 1fr;gap:18px;align-items:baseline;margin-bottom:22px"> <span style="color:var(--canada-300);font-family:var(--font-mono);font-weight:700;letter-spacing:0.18em;font-size:var(--text-xs)">03</span> <h2 style="margin:0;color:var(--text-primary);font-family:var(--font-mono);font-size:clamp(22px, 2.8vw, 26px);line-height:1.1;letter-spacing:-0.025em">Recent Field Notes</h2> </div> <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px"> <a href="/notes/what-was-the-review-ever-for/" style="min-height:218px;display:flex;flex-direction:column;justify-content:space-between;padding:22px;border:1px solid var(--border);border-radius:var(--radius-lg);text-decoration:none;color:inherit;background:radial-gradient(120% 150% at 100% 0%, rgba(129, 140, 248, 0.18), transparent 55%), linear-gradient(135deg, rgba(47, 43, 40, 0.72), rgba(39, 35, 37, 0.68))"> <div style="color:var(--indigo-400);font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase">The New SDLC · 17 min read</div> <div> <h3 style="margin:0 0 10px;color:var(--text-primary);font-family:var(--font-mono);font-size:clamp(26px, 3.5vw, 32px);line-height:1.1;letter-spacing:-0.04em">What was the review ever for?</h3> <p style="margin:0;font-family:var(--font-prose);color:var(--text-secondary);line-height:1.55">A page that annoyed me when I resized the window, and a production code path that cost five to ten times what it should have. Neither was a defect, neither would have shown up in a diff, and one of them survived every review I designed.</p> </div> </a> <div style="display:grid;gap:12px"> <a href="/notes/scarcity-was-the-feature/" style="padding:0 0 14px 16px;border-left:2px solid var(--border-strong);border-bottom:1px solid var(--border);text-decoration:none;color:inherit"> <h3 style="margin:0 0 6px;font-family:var(--font-mono);font-size:var(--text-base);color:var(--text-primary)">Scarcity was the feature</h3> <p style="margin:0;font-family:var(--font-prose);color:var(--text-muted);font-size:var(--text-sm);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">Every sovereign AI pitch in this country opens with the same apology: Canada cannot out-spend the hyperscalers. But scarcity built better engineers once, and it can again. On metered compute, capabilities over models, and a library card for the model era.</p> </a><a href="/notes/postman-was-a-workaround/" style="padding:0 0 14px 16px;border-left:2px solid rgba(213, 43, 30, 0.7);border-bottom:1px solid var(--border);text-decoration:none;color:inherit"> <h3 style="margin:0 0 6px;font-family:var(--font-mono);font-size:var(--text-base);color:var(--text-primary)">Postman was a workaround</h3> <p style="margin:0;font-family:var(--font-prose);color:var(--text-muted);font-size:var(--text-sm);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">I set out to explore a sparsely documented API in Postman and lasted about an hour before I gave up and built the client I actually wanted. The generic tool was only ever a workaround for a cost that just evaporated: building the specific thing yourself. On why buy-over-build is dying, why most of your code is now disposable, and the access-patterns-to-spec-to-code ritual I build with now.</p> </a><a href="/notes/punish-your-way-to-a-great-culture/" style="padding:0 0 14px 16px;border-left:2px solid rgba(71, 207, 237, 0.7);border-bottom:1px solid var(--border);text-decoration:none;color:inherit"> <h3 style="margin:0 0 6px;font-family:var(--font-mono);font-size:var(--text-base);color:var(--text-primary)">You cannot punish your way to a great culture</h3> <p style="margin:0;font-family:var(--font-prose);color:var(--text-muted);font-size:var(--text-sm);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">Every few months a leadership post makes the rounds insisting culture is what you tolerate. I keep landing on the opposite, from humility more than pride: the best teams I have watched ran on trust. On why punishment only buys you silence, the unglamorous work that actually grows a culture, and why it comes back to who you hired.</p> </a> </div> </div> </section> <section style="padding:42px 0;border-bottom:1px solid var(--border)"> <div style="display:grid;grid-template-columns:60px 1fr;gap:18px;align-items:baseline;margin-bottom:22px"> <span style="color:var(--canada-300);font-family:var(--font-mono);font-weight:700;letter-spacing:0.18em;font-size:var(--text-xs)">04</span> <h2 style="margin:0;color:var(--text-primary);font-family:var(--font-mono);font-size:clamp(22px, 2.8vw, 26px);line-height:1.1;letter-spacing:-0.025em">Selected Lab Reports</h2> </div> <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:22px"> <a href="/lab/grey-eminence/" style="min-height:184px;display:flex;flex-direction:column;padding:20px;border:1px solid var(--border);border-radius:var(--radius-lg);background:linear-gradient(180deg, rgba(47, 43, 40, 0.58), rgba(32, 30, 28, 0.35));text-decoration:none;color:inherit"> <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:30px"><span style="display:inline-flex;align-items:center;gap:0.4rem;font-family:var(--font-label);font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-wide);padding:0.25rem 0.6rem;border-radius:var(--radius-full);color:var(--teal-400);background:transparent;border:1px solid var(--teal-400)"><span style="width:6px;height:6px;border-radius:9999px;background:#47cfed"></span>Software</span><span style="display:inline-flex;align-items:center;gap:0.4rem;font-family:var(--font-label);font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-wide);padding:0.25rem 0.6rem;border-radius:var(--radius-full);color:var(--indigo-400);background:rgba(129,140,248,0.12);border:1px solid rgba(129,140,248,0.4)">AI-assisted</span></div> <h3 style="margin:0 0 9px;color:var(--text-primary);font-family:var(--font-mono);font-size:var(--text-xl);letter-spacing:-0.03em">Grey Eminence</h3> <p style="margin:0;font-family:var(--font-prose);font-size:var(--text-sm);line-height:1.55;color:var(--text-secondary)">A native macOS meeting recorder that never joins the call: on-device transcription, speaker if (q.get('v')) active = Math.max(0, Math.min(versions.length - 1, +q.get('v')));
if (q.get('all')) compare = true;

function frame(v) {
  const fig = document.createElement('figure');
  fig.innerHTML = '<figcaption>' + v.title + ' <span class="w"></span></figcaption><div class="phone"><iframe title="' + v.title + '"></iframe></div>';
  const f = fig.querySelector('iframe');
  f.addEventListener('load', () => {
    const d = f.contentDocument;
    f.style.height = d.documentElement.scrollHeight + 'px';
    const over = d.documentElement.scrollWidth - d.documentElement.clientWidth;
    const W = d.documentElement.clientWidth, bad = [];
    d.querySelectorAll('body *').forEach(e => { const r = e.getBoundingClientRect(); if (r.right > W + 1 && r.width && !bad.some(b => b.contains(e))) { let p = e.parentElement, clipped = false; while (p) { const o = getComputedStyle(p).overflowX; if (o === 'auto' || o === 'hidden' || o === 'scroll') { clipped = true; break; } p = p.parentElement; } if (!clipped) bad.push(e); } });
    fig.dataset.over = bad.slice(0, 6).map(e => e.tagName + '[' + (e.textContent || '').trim().slice(0, 24) + '] r=' + Math.round(e.getBoundingClientRect().right)).join(' | ');
    fig.querySelector('.w').innerHTML = over > 0 ? '<span class="warn">· scrolls sideways ' + over + 'px</span>' : '· fits';
  });
  f.srcdoc = base.replace('</head>', '<style>' + v.css + '</style></head>');
  return fig;
}

function render() {
  const v = versions[active];
  count.textContent = compare ? 'All ' + versions.length + ' versions' : 'Version ' + (active + 1) + ' of ' + versions.length;
  vtitle.textContent = compare ? 'Side by side at 390px' : v.title;
  vdesc.textContent = compare ? 'Each frame is the real built home page with that version\'s phone CSS applied.' : v.desc;
  all.setAttribute('aria-pressed', compare);
  stage.replaceChildren(...(compare ? versions : [v]).map(frame));
}
prev.onclick = () => { compare = false; active = (active + versions.length - 1) % versions.length; render(); };
next.onclick = () => { compare = false; active = (active + 1) % versions.length; render(); };
all.onclick = () => { compare = !compare; render(); };
render();
</script>
</body></html>
